name: Autonomous Collision Risk Engine

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows you to click a button on GitHub to run it manually

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run AI & Physics Engine
      run: |
        cd backend
        python collision_engine.py

    - name: Commit and Push Updated Warnings
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add backend/collision_warnings.json || echo "No warnings file to add"
        git commit -m "Auto-update: Latest Collision Warnings" || echo "No changes to commit"
        git push
